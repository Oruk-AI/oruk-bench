[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oruk-bench"
version = "0.1.1"
description = "Public tooling for the Oruk speech-emotion benchmark: data loading, scoring, model adapters, and leaderboard statistics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Oruk AI" }]
keywords = ["speech", "emotion", "benchmark", "evaluation", "audio"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyarrow>=15",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/Oruk-AI/oruk-bench"

[project.scripts]
oruk-bench = "oruk_bench.cli:main"

[project.optional-dependencies]
open = [
    "torch>=2.1",
    "transformers>=4.57",
    "librosa>=0.10",
    "funasr>=1.1",
    "speechbrain>=1.0",
    "modelscope>=1.20",
]
audiollm = [
    "torch>=2.1",
    "transformers>=4.57",
    "accelerate>=0.30",
    "librosa>=0.10",
    "jinja2>=3.1",
]
api = [
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
