name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (base + dev only, no model deps)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Pytest (synthetic fixture, score path only)
        run: pytest -q
